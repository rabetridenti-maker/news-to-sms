[project]
name = "news-to-sms"
version = "0.1.0"
description = "Fetch today's news from a URL, sanitize to plain text, split into <=200-char SMS chunks, and send from a fixed sender number via an SMS gateway (校讯通), plus a per-day markdown archive."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "anyio>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "basedpyright>=1.19",
    "ruff>=0.6",
]

[project.scripts]
news-to-sms = "news_to_sms.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_to_sms"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF",
    "PT", "C4", "PIE", "PERF", "RET", "TRY", "T20", "FA", "N", "DTZ",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Fullwidth CJK punctuation (，。！？；) is intentional in the segmenter, LLM prompt and tests.
"tests/*" = ["S101", "S105", "S311", "SLF001", "INP001", "RUF001", "RUF002", "RUF003"]
"src/news_to_sms/segmenter.py" = ["RUF001", "RUF002", "RUF003"]
"src/news_to_sms/llm.py" = ["RUF001", "RUF002", "RUF003"]
"src/news_to_sms/__main__.py" = ["INP001"]
"src/news_to_sms/__init__.py" = ["INP001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
anyio_mode = "auto"
